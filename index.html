    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="SKT Travels - Premium travel and transportation services across Tamil Nadu and Kerala, starting from Tenkasi.">
    <title>SKT Travels | Your Journey. Our Drive.</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lightweight Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================================
           1. CSS VARIABLES & RESET
           ========================================= */
        :root {
            --navy: #0A192F;
            --charcoal: #1E293B;
            --white: #F8FAFC;
            --gold: #D4AF37;
            --gold-hover: #B5952F;
            --gold-light: rgba(212, 175, 55, 0.1);
            --text-muted: #94A3B8;
            --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --transition-smooth: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            --shadow: 0 10px 30px -10px rgba(2, 12, 27, 0.7);
            --radius: 12px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
        }

        a, button, input, select, textarea, .fleet-card, .dest-card, .qc-item {
            -webkit-tap-highlight-color: transparent !important;
            outline: none;
        }

        a:focus:not(:focus-visible),
        button:focus:not(:focus-visible) {
            outline: none !important;
            box-shadow: none !important;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Tamil', sans-serif;
            background-color: var(--white);
            color: var(--charcoal);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }
        .section-padding { padding: 4rem 0; }
        .text-center { text-align: center; }
        .text-gold { color: var(--gold); }
        .bg-navy { background-color: var(--navy); color: var(--white); }
        .bg-charcoal { background-color: var(--charcoal); color: var(--white); }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.7rem 1.4rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition-smooth);
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            line-height: 1.2;
            flex-shrink: 0;
            user-select: none;
            position: relative;
            overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .btn:active::after {
            width: 300px;
            height: 300px;
        }
        .btn-primary {
            background-color: var(--gold);
            color: var(--navy);
            background-image: linear-gradient(135deg, #D4AF37 0%, #E8C65A 50%, #D4AF37 100%);
            background-size: 200% 200%;
            animation: shimmerGold 4s ease-in-out infinite;
        }
        @keyframes shimmerGold {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .btn-primary:hover {
            background-color: var(--gold-hover);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 14px 28px -5px rgba(212, 175, 55, 0.55);
        }
        .btn-outline {
            border-color: var(--gold);
            color: var(--gold);
            background: transparent;
        }
        .btn-outline:hover {
            background-color: var(--gold);
            color: var(--navy);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.3);
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 0.45rem 0.9rem;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: var(--transition-smooth);
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
        }
        .lang-btn:hover {
            background: var(--gold);
            color: var(--navy);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px -3px rgba(212, 175, 55, 0.45);
        }

        /* =========================================
           2. NAVIGATION
           ========================================= */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
            padding: 0.9rem 0;
            transition: var(--transition-smooth);
            background: rgba(10, 25, 47, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .navbar.scrolled {
            background: rgba(10, 25, 47, 0.92);
            padding: 0.55rem 0;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.4);
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
            letter-spacing: -0.5px;
            white-space: nowrap;
            transition: var(--transition-smooth);
        }
        .logo:hover { transform: scale(1.04); }
        .logo span { 
            color: var(--gold); 
            background: linear-gradient(90deg, #D4AF37, #F4D77A, #D4AF37);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 4s linear infinite;
        }
        @keyframes goldShine {
            to { background-position: 200% center; }
        }
        
        .nav-links {
            display: none;
            list-style: none;
            gap: 1.4rem;
            align-items: center;
        }
        .nav-links a:not(.btn) {
            color: var(--white);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            position: relative;
            white-space: nowrap;
        }
        .nav-links a:not(.btn)::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .nav-links a:not(.btn):hover { color: var(--gold); }
        .nav-links a:not(.btn):hover::after { width: 100%; }

        .desktop-lang { display: none; }
        .mobile-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .mobile-menu-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            transition: var(--transition);
        }
        .mobile-menu-btn:hover { color: var(--gold); transform: scale(1.1); }

        @media (min-width: 992px) {
            .nav-links { display: flex; }
            .desktop-lang { display: inline-flex; }
            .mobile-actions { display: none; }
        }

        /* Mobile Drawer */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 82%;
            max-width: 320px;
            height: 100vh;
            background: var(--navy);
            z-index: 1001;
            padding: 4.5rem 1.75rem 2rem;
            transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        .mobile-menu-links a {
            color: var(--white);
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
            transition: var(--transition);
            padding-left: 0;
        }
        .mobile-menu-links a:hover { color: var(--gold); padding-left: 6px; }
        .close-menu {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            transition: var(--transition);
        }
        .close-menu:hover { color: var(--gold); transform: rotate(90deg); }
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(4px);
        }
        .overlay.active { opacity: 1; pointer-events: all; }

        /* =========================================
           3. HERO SECTION (banner1.png)
           ========================================= */
        .hero {
            position: relative;
            min-height: 85vh;
            padding-top: 5rem;
            padding-bottom: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: var(--navy);
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            background-color: var(--navy);
            background-image: linear-gradient(rgba(10, 25, 47, 0.65), rgba(10, 25, 47, 0.75)), 
                              url('./banner1.png');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            transform: scale(1.1);
            z-index: 1;
            animation: kenBurns 18s ease-out forwards;
        }
        @keyframes kenBurns {
            0% { transform: scale(1.1); filter: blur(8px); opacity: 0.5; }
            30% { filter: blur(0px); opacity: 1; }
            100% { transform: scale(1.02); }
        }
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: var(--white);
            max-width: 820px;
            padding: 0 1rem;
        }
        .hero-location {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.1);
            padding: 0.45rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease-out 0.2s forwards;
            backdrop-filter: blur(6px);
        }
        .hero h1 {
            font-size: clamp(2rem, 6vw, 3.8rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease-out 0.5s forwards;
            letter-spacing: -0.5px;
        }
        .hero h1 .text-gold {
            background: linear-gradient(120deg, #D4AF37 0%, #F4D77A 40%, #E8C65A 70%, #D4AF37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 5s linear infinite;
            display: inline-block;
        }
        .hero p {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease-out 0.8s forwards;
        }
        .hero-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease-out 1.1s forwards;
        }
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @media (min-width: 640px) {
            .hero-buttons { flex-direction: row; justify-content: center; }
        }

        /* =========================================
           4. QUICK CONTACT BAR (Centered & Compact)
           ========================================= */
        .quick-contact-wrapper {
            position: relative;
            z-index: 10;
            margin-top: -2.5rem;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease-out 1.3s forwards;
        }

        .quick-contact {
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 12px 35px -5px rgba(2, 12, 27, 0.16), 0 0 1px 1px rgba(0, 0, 0, 0.05);
            padding: 0.65rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            width: fit-content;
            min-width: 250px;
            max-width: 320px;
            margin: 0 auto;
            transition: var(--transition-smooth);
        }
        .quick-contact:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 45px -10px rgba(2, 12, 27, 0.22);
        }

        @media (min-width: 768px) {
            .quick-contact {
                flex-direction: row;
                max-width: none;
                min-width: unset;
                padding: 0.75rem 1.25rem;
                gap: 1rem;
            }
        }

        .qc-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--charcoal);
            padding: 0.5rem 0.85rem;
            border-radius: 10px;
            background: #F8FAFC;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .qc-item::before {
            content: '';
            position: absolute;
            left: -100%;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            transition: left 0.6s ease;
        }
        .qc-item:hover::before { left: 100%; }
        .qc-item:hover { 
            background: var(--gold-light); 
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 20px -5px rgba(212, 175, 55, 0.25);
        }

        .qc-icon {
            width: 38px;
            height: 38px;
            background: var(--navy);
            color: var(--gold);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            transition: var(--transition-smooth);
        }
        .qc-item:hover .qc-icon {
            transform: rotate(8deg) scale(1.08);
        }

        .qc-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.25;
            text-align: left;
        }
        .qc-label { 
            font-size: 0.68rem; 
            color: var(--text-muted); 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.6px;
            margin-bottom: 1px;
        }
        .qc-value { 
            font-size: 0.9rem; 
            font-weight: 700; 
            color: var(--navy);
            white-space: nowrap;
            transition: var(--transition);
        }
        .qc-item:hover .qc-value { color: var(--gold-hover); }

        /* =========================================
           5. ABOUT SECTION (Dedicated Smooth Fade Only)
           ========================================= */
        .about-box {
            max-width: 820px;
            margin: 0 auto;
            text-align: center;
            opacity: 0;
            transition: opacity 0.65s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: opacity;
        }
        .about-box.visible {
            opacity: 1;
        }
        .section-title {
            font-size: clamp(1.6rem, 3.5vw, 2.3rem);
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 0.75rem;
            line-height: 1.25;
            transition: letter-spacing 0.4s ease;
        }
        .section-title:hover { letter-spacing: 0.5px; }
        .section-title .text-gold {
            background: linear-gradient(120deg, #D4AF37 0%, #F4D77A 50%, #D4AF37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 5s linear infinite;
            display: inline-block;
        }
        .section-subtitle {
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.82rem;
            margin-bottom: 0.4rem;
            display: block;
            position: relative;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .section-subtitle::before,
        .section-subtitle::after {
            content: '';
            display: inline-block;
            width: 28px;
            height: 2px;
            background: var(--gold);
            vertical-align: middle;
            margin: 0 0.6rem;
            opacity: 0.6;
            transition: width 0.4s ease;
        }
        .section-subtitle:hover::before,
        .section-subtitle:hover::after { width: 45px; }

        .about-box ul li {
            transition: var(--transition-smooth);
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
        }
        .about-box ul li:hover {
            background: var(--gold-light);
            transform: translateX(6px);
        }

        /* =========================================
           6. FLEET SECTION (Original)
           ========================================= */
        .fleet-container {
            position: relative;
            overflow: hidden;
        }
        .fleet-track {
            display: flex;
            gap: 1.25rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 0.5rem 0 1.5rem 0;
            scrollbar-width: none;
        }
        .fleet-track::-webkit-scrollbar { display: none; }
        .fleet-card {
            flex: 0 0 88%;
            max-width: 320px;
            scroll-snap-align: center;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.05);
            transition: var(--transition-smooth);
        }
        .fleet-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 35px -8px rgba(0,0,0,0.15);
        }
        @media (min-width: 768px) {
            .fleet-card { flex: 0 0 calc(50% - 1rem); max-width: 380px; }
        }
        @media (min-width: 1024px) {
            .fleet-card { flex: 0 0 calc(25% - 1rem); max-width: 300px; }
        }
        .fleet-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #e2e8f0;
        }
        .fleet-info { padding: 1.25rem; }
        .fleet-name { 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: var(--navy); 
            margin-bottom: 0.6rem; 
        }
        .fleet-features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.85rem;
        }
        .feature-tag {
            background: var(--gold-light);
            color: var(--navy);
            padding: 0.2rem 0.65rem;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            transition: var(--transition);
        }
        .feature-tag:hover {
            background: var(--gold);
            transform: translateY(-2px);
        }
        .fleet-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        /* Fleet Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 47, 0.9);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 1.25rem;
            backdrop-filter: blur(8px);
        }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--white);
            border-radius: var(--radius);
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.92);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .modal.active .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute;
            top: 0.85rem;
            right: 0.85rem;
            background: var(--white);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: #ef4444; color: white; transform: rotate(90deg); }
        .modal-img { width: 100%; height: 260px; object-fit: cover; }
        .modal-body { padding: 1.5rem; }

        /* =========================================
           7. WHY CHOOSE US (Original)
           ========================================= */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }
        .stat-item {
            padding: 0.5rem 0.25rem;
            transition: var(--transition-smooth);
        }
        .stat-item:hover { transform: translateY(-6px); }
        .stat-item h3 {
            font-size: clamp(1.25rem, 3.5vw, 2.2rem);
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 0.25rem;
            line-height: 1;
            background: linear-gradient(120deg, #D4AF37, #F4D77A, #D4AF37);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 5s linear infinite;
            display: inline-block;
        }
        .stat-item p {
            color: var(--text-muted);
            font-size: clamp(0.7rem, 1.8vw, 0.88rem);
            font-weight: 600;
            line-height: 1.2;
        }

        /* =========================================
           8. DESTINATIONS (Original)
           ========================================= */
        .destinations-track {
            display: flex;
            gap: 1.25rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 0.5rem 0 1.5rem 0;
            scrollbar-width: none;
        }
        .destinations-track::-webkit-scrollbar { display: none; }
        .dest-card {
            flex: 0 0 240px;
            scroll-snap-align: start;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            height: 320px;
            box-shadow: 0 10px 25px -8px rgba(0,0,0,0.3);
            transition: var(--transition-smooth);
        }
        .dest-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.4);
        }
        .dest-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
            opacity: 0;
            animation: imgFadeIn 1s ease forwards;
        }
        @keyframes imgFadeIn {
            from { opacity: 0; filter: blur(6px) brightness(0.8); }
            to { opacity: 1; filter: blur(0) brightness(1); }
        }
        .dest-card:hover img { 
            transform: scale(1.12); 
            filter: saturate(1.15);
        }
        .dest-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,25,47,0.92) 20%, transparent 80%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.25rem;
            color: var(--white);
            transition: var(--transition-smooth);
        }
        .dest-overlay h3 {
            transition: var(--transition);
        }
        .dest-card:hover .dest-overlay h3 { color: var(--gold); letter-spacing: 0.3px; }
        .dest-overlay button {
            transform: translateY(12px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .dest-card:hover .dest-overlay button {
            transform: translateY(0);
            opacity: 1;
        }

        /* =========================================
           9. BOOKING FORM (Original)
           ========================================= */
        #booking {
            background: #f1f5f9;
            padding-bottom: 4rem;
        }
        .booking-form {
            background: var(--white);
            padding: 1.75rem 1.25rem;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 780px;
            margin: 0 auto;
            transition: var(--transition-smooth);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .booking-form:hover {
            box-shadow: 0 20px 45px rgba(0,0,0,0.09);
            transform: translateY(-3px);
        }
        .form-grid {
            display: grid;
            gap: 1.25rem;
        }
        @media (min-width: 768px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
            .form-full { grid-column: 1 / -1; }
            .booking-form { padding: 2.25rem; }
        }
        .form-group { 
            display: flex; 
            flex-direction: column; 
            gap: 0.4rem; 
            transition: var(--transition);
        }
        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--charcoal);
            transition: var(--transition);
        }
        .form-group input, .form-group select, .form-group textarea {
            padding: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.92rem;
            background: var(--white);
            width: 100%;
            transition: var(--transition-smooth);
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-light), 0 6px 16px -6px rgba(212, 175, 55, 0.25);
            transform: translateY(-1px);
        }
        .form-group input:focus + span, .form-group textarea:focus + span {
            opacity: 0;
        }
        .form-group label:has(+ input:focus),
        .form-group label:has(+ textarea:focus) {
            color: var(--gold-hover);
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.72rem;
            display: none;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .form-group.error input, .form-group.error select { border-color: #ef4444; }
        .form-group.error .error-msg { display: block; }

        /* =========================================
           10. GALLERY (Original)
           ========================================= */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        @media (min-width: 768px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .gallery-item {
            border-radius: 8px;
            overflow: hidden;
            height: 180px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            transition: var(--transition-smooth);
        }
        .gallery-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(10, 25, 47, 0.5));
            opacity: 0;
            z-index: 1;
            transition: opacity 0.4s ease;
        }
        .gallery-item::after {
            content: '↗';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            color: white;
            font-size: 2rem;
            font-weight: 300;
            opacity: 0;
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .gallery-item:hover::before { opacity: 1; }
        .gallery-item:hover::after { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -10px rgba(2, 12, 27, 0.3);
        }
        @media (min-width: 768px) {
            .gallery-item { height: 220px; }
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), filter 0.4s ease;
            opacity: 0;
            animation: imgFadeIn 1.2s ease forwards;
        }
        .gallery-item:hover img { 
            transform: scale(1.1); 
            filter: brightness(0.75);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            backdrop-filter: blur(10px);
        }
        .lightbox.active { opacity: 1; pointer-events: all; }
        .lightbox img { 
            max-width: 90%; 
            max-height: 85vh; 
            border-radius: 8px; 
            transform: scale(0.85);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        .lightbox.active img { transform: scale(1); }
        .lightbox-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            color: var(--white);
            background: rgba(255,255,255,0.1);
            border: none;
            cursor: pointer;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .lightbox-close:hover { background: #ef4444; transform: rotate(90deg); }

        /* =========================================
           11. REVIEWS SECTION & ACCORDION (Original)
           ========================================= */
        .reviews-section {
            background: #0d1b2e;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }
        .reviews-section::before {

            top: -50%;

            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.08), transparent 40%),

            pointer-events: none;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }
        @keyframes floatGlow {
            from { transform: translate(0, 0); }
            to { transform: translate(3%, -3%); }
        }
        .reviews-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 650px;
            margin: 2rem auto 0 auto;
            position: relative;
            z-index: 1;
        }

            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: var(--transition-smooth);
            backdrop-filter: blur(6px);
        }

            background-size: 200% 200%;
            animation: shimmerGold 4s ease-in-out infinite;
        }
        .review-toggle-btn:hover {
            background: var(--gold-hover);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.45);

        .review-toggle-btn .toggle-icon {
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

            border-radius: 8px;
            color: var(--white);
            margin-top: 0.35rem;

            font-family: inherit;

        }
        .review-collapsible-content input:focus, .review-collapsible-content textarea:focus {

            background: rgba(212, 175, 55, 0.06);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
            transform: translateY(-1px);

        .star-rating-select {

            user-select: none;
        }

            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }
